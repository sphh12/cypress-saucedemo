# Cypress E2E 테스트 CI — push/PR/수동 실행/야간 회귀 시 전체 테스트를 돌린 뒤
# HTML 리포트와 실패 산출물(스크린샷·비디오)을 아티팩트로 업로드한다.
name: "[Daily] Regression Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions 탭에서 수동 실행 가능
  workflow_dispatch:
  # 야간 회귀 — 코드 변경이 없어도 매일 1회 실행해 대상 사이트(saucedemo) 변화와
  # 플레이키 테스트를 감지한다. cron 은 UTC 기준이며 기본 브랜치에서만 동작한다.
  #   '17 18 * * *' = UTC 18:17 = KST 03:17 (다음날 새벽 / KST = UTC+9)
  #   정시(:00)는 GitHub 부하가 커 지연되므로 일부러 17분으로 둔다.
  schedule:
    - cron: '17 18 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # cypress 15 는 node ^20.1 || ^22 || >=24 를 요구한다 (21·23 은 미지원)
          node-version: '22'
          cache: 'npm'

      # cypress 바이너리(~300MB)는 node_modules 밖(~/.cache/Cypress)에 설치되므로
      # npm ci 보다 먼저 복원해야 postinstall 이 재다운로드를 건너뛴다
      - name: Cypress 바이너리 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: "cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}"
          restore-keys: "cypress-${{ runner.os }}-"

      - name: 의존성 설치
        run: npm ci

      - name: Cypress 설치 검증
        run: npx cypress verify

      # 로그인 프로필·테스트데이터 주입 파일은 gitignore 대상이라 CI 에서 생성한다.
      # saucedemo 공개 데모 계정이므로 시크릿이 필요 없다.
      # (실제 민감값을 쓰는 프로젝트라면 Repository Secrets 로 주입 — docs/ci-guide.md 참고)
      - name: 환경 설정 파일 생성
        run: cp cypress.env.example.json cypress.env.json

      # 값에 콜론(:)이 있으면 YAML 이 "키: 값" 구분자로 오인하므로 반드시 따옴표로 감싼다
      # specPattern 전체(20 스펙)에는 템플릿 잔여물이 섞여 있어 회귀 대상에서 제외한다.
      #   sample/*  : 대상 앱이 설정되지 않은 플레이스홀더 스텁 (로컬에서도 실패한다)
      #   example/* : example.cypress.io 를 치는 Kitchen Sink 학습 예제 (외부 사이트)
      # 따라서 이 프로젝트의 실제 스위트(saucedemo, 7 스펙 / 27 테스트)만 돌린다.
      - name: "테스트 실행 (CI: 실패 시 2회 재시도)"
        run: npx cypress run --browser chrome --spec "cypress/e2e/saucedemo/**/*.cy.js" --config retries=2

      # 성공/실패 무관하게 업로드한다. 비디오는 리포터가 reports/html/videos 로 복사하며,
      # 성공한 스펙의 비디오는 cypress.config.js 의 after:spec 훅이 이미 삭제한 상태다.
      - name: 리포트 업로드 (실패 시에도 항상)
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cypress-report
          path: |
            cypress/reports/html/
            cypress/screenshots/
          retention-days: 30
